# Once a week, take the latest fakes from every port (fake/ports/update.sh),
# regenerate the shared SWI numbers and fake/fake_origin.md, run make check,
# and open a pull request if anything changed. Merge it and the fakes here
# are current; nothing in fake/ports is ever edited by hand.
#
# Needs, in the repository's Settings > Actions > General: "Workflow
# permissions: Read and write" and "Allow GitHub Actions to create and
# approve pull requests". Run it by hand from the Actions tab too.
name: Update the ports' fakes

on:
  schedule:
    - cron: '23 5 * * 1'        # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross libglib2.0-0 libcairo2-dev gawk zip unzip

      - uses: actions/cache@v4
        with:
          path: |
            toolchain/dl
            devkit/dl
          key: dl-${{ hashFiles('toolchain/PREBUILT', 'devkit/DEVKIT') }}

      - name: The toolchain and the devkit this release names
        run: make prebuilt devkit

      - name: Take the latest fakes from every port
        run: SUMMARY="$RUNNER_TEMP/changes.md" fake/ports/update.sh

      - name: make check
        id: check
        continue-on-error: true
        run: make check 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: The pull request's text
        run: |
          {
            echo "Taken by \`fake/ports/update.sh\` from each port's latest commit on GitHub."
            echo "\`fake/fake_origin.md\` has the commits and the SWI numbers."
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            if [ "${{ steps.check.outcome }}" = success ]; then
              echo "\`make check\` passed."
            else
              echo "**\`make check\` failed.** A fake is fixed in its port, never here:"
              echo "send the port a handoff. The end of the output:"
              echo
              echo '```'
              tail -40 "$RUNNER_TEMP/check.log"
              echo '```'
            fi
          } > "$RUNNER_TEMP/body.md"

      - uses: peter-evans/create-pull-request@v6
        with:
          branch: update-fakes
          add-paths: fake
          commit-message: "fake/ports: the ports' latest fakes"
          title: "The ports' latest fakes"
          body-path: ${{ runner.temp }}/body.md
          delete-branch: true

      - name: Fail if make check failed
        if: steps.check.outcome != 'success'
        run: exit 1
