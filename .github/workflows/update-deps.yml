# riscos-crossdev's own dependency updates: once a day, see whether
# riscos-mesa (the devkit) or riscos-unixlib (in the toolchain) has a newer
# release than .riscos-deps names. If one has, update devkit/DEVKIT or
# toolchain/SOURCES (toolchain/deps-hook.sh), build and check, and open a
# pull request saying whether that worked. It never merges or releases:
# a new UnixLib also needs a new toolchain tarball (make dist,
# toolchain/PREBUILT) and a release, by hand. The ports use the same
# mechanism from ci/riscos-deps-update.yml.
name: Dependency updates

on:
  schedule:
    - cron: '17 6 * * *'         # every day, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Newer releases of what .riscos-deps names
        id: deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > "$RUNNER_TEMP/changes.md"; hookfail=0
          cp .riscos-deps "$RUNNER_TEMP/deps.in"
          while read -r name tag _; do
            case $name in ''|'#'*) continue;; esac
            repo=$name; case $repo in */*) ;; *) repo=adyoull/$repo;; esac
            latest=$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null || true)
            # Only ever forwards: a "latest" release older than the pin
            # (one marked latest by mistake, say) is left alone.
            if [ -z "$latest" ] || [ "$latest" = "$tag" ] ||
               [ "$(printf '%s\n%s\n' "$tag" "$latest" | sort -V | tail -1)" != "$latest" ]; then
              echo "$name: $tag (latest: ${latest:-no release})"; continue
            fi
            echo "$name: $tag -> $latest"
            if ! toolchain/deps-hook.sh "$name" "$tag" "$latest"; then
              hookfail=1
              echo "- **$name: $tag → $latest: \`ci/riscos-deps-hook.sh\` failed**" >> "$RUNNER_TEMP/changes.md"
            else
              echo "- $name: $tag → $latest ([release notes](https://github.com/$repo/releases/tag/$latest))" >> "$RUNNER_TEMP/changes.md"
            fi
            awk -v n="$name" -v t="$latest" '$1 == n {$2 = t} {print}' .riscos-deps > "$RUNNER_TEMP/deps"
            cat "$RUNNER_TEMP/deps" > .riscos-deps
          done < "$RUNNER_TEMP/deps.in"
          if [ -s "$RUNNER_TEMP/changes.md" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; else echo "new=false" >> "$GITHUB_OUTPUT"; fi
          echo "hookfail=$hookfail" >> "$GITHUB_OUTPUT"

      - name: Packages
        if: steps.deps.outputs.new == 'true'
        run: |
          sudo apt-get update
          # As docs/SETUP.md, with what make toolchain needs. gcc-13-multilib,
          # not gcc-multilib (it conflicts with gcc-arm-linux-gnueabihf).
          sudo apt-get install -y gcc-13-multilib gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross libglib2.0-0t64 libcairo2-dev gawk zip unzip cmake \
            autogen autoconf2.69 autoconf2.64 automake1.11 automake libtool texinfo \
            gperf flex bison m4 ninja-build libglib2.0-dev python3-venv
          pip install --break-system-packages unicorn

      - name: Build and check with them
        id: build
        if: steps.deps.outputs.new == 'true'
        continue-on-error: true
        run: |
          # A new UnixLib changes toolchain/SOURCES: build the toolchain from
          # source (about 30 minutes). Otherwise use the prebuilt one.
          if git diff --quiet toolchain/SOURCES; then what=prebuilt; else what=toolchain; fi
          echo "toolchain: make $what" | tee "$RUNNER_TEMP/build.log"
          { make "$what" && make devkit && make check; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Leave only the changed pins
        if: steps.deps.outputs.new == 'true'
        run: git clean -fdxq -e toolchain/dl -e devkit/dl

      - name: The pull request's text
        if: steps.deps.outputs.new == 'true'
        env:
          OUTCOME: ${{ steps.build.outcome }}
          HOOKFAIL: ${{ steps.deps.outputs.hookfail }}
        run: |
          {
            echo "Newer releases of this repository's dependencies:"
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            if [ "$OUTCOME" = success ] && [ "$HOOKFAIL" = 0 ]; then
              echo "\`make check\` passed with them, on Linux."
            else
              echo "**The build or \`make check\` failed with them.** The end of the output:"
              echo
              echo '```'
              tail -40 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "(no build: see the workflow run)"
              echo '```'
            fi
            echo
            echo "Before releasing: update the version mentions and CHANGELOG.md; for a new UnixLib, make dist and toolchain/PREBUILT too. Nothing has run on RISC OS."
          } > "$RUNNER_TEMP/body.md"

      - uses: peter-evans/create-pull-request@v8
        if: steps.deps.outputs.new == 'true'
        with:
          branch: riscos-deps-update
          commit-message: "Dependency updates (.riscos-deps)"
          title: "Dependency updates"
          body-path: ${{ runner.temp }}/body.md
          delete-branch: true
